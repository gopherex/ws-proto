name: Release

# Triggered by pushing a vX.Y.Z tag (see `make release`). Builds the Go, Swift
# and Kotlin protoc plugins and publishes npm and Maven packages to GitHub
# Packages, all gated on a green CI run. SwiftPM consumes the same Git tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Releases must build green: reuse the full CI suite.
  ci:
    uses: ./.github/workflows/ci.yml

  create-release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - name: Check the npm package version matches the tag
        run: |
          v="$(node -p 'require("./packages/ws-proto-transport/package.json").version')"
          if [ "v$v" != "$TAG" ]; then
            echo "::error::npm package version is $v but the tag is $TAG (run make release)"
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"

  binaries:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    env:
      TAG: ${{ github.ref_name }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum
      - name: Build protoc plugins
        run: |
          for plugin in protoc-gen-go-ws protoc-gen-ws-swift protoc-gen-ws-kotlin; do
            out="$plugin"
            if [ "$GOOS" = "windows" ]; then out="$plugin.exe"; fi
            CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "dist/$out" "./cmd/$plugin"
          done
      - name: Archive
        run: |
          cd dist
          for plugin in protoc-gen-go-ws protoc-gen-ws-swift protoc-gen-ws-kotlin; do
            base="${plugin}_${TAG}_${GOOS}_${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              zip "../${base}.zip" "$plugin.exe"
            else
              tar -czf "../${base}.tar.gz" "$plugin"
            fi
          done
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(protoc-gen-*_${TAG}_${GOOS}_${GOARCH}.tar.gz protoc-gen-*_${TAG}_${GOOS}_${GOARCH}.zip)
          gh release upload "$TAG" "${assets[@]}" --clobber

  kotlin:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish Kotlin to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: >-
          packages/ws-proto-kotlin/gradlew -p packages/ws-proto-kotlin
          --no-daemon -PreleaseVersion="${TAG#v}" publish
      - name: Verify published Maven artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          base="https://maven.pkg.github.com/gopherex/ws-proto/io/gopherex/ws-proto-kotlin/$version/ws-proto-kotlin-$version"
          mkdir -p "$RUNNER_TEMP/maven-download"
          for extension in pom jar; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              --user "$GITHUB_ACTOR:$GITHUB_TOKEN" "$base.$extension" \
              --output "$RUNNER_TEMP/maven-download/library.$extension"
          done
          jar tf "$RUNNER_TEMP/maven-download/library.jar" | grep 'io/gopherex/wsproto/WsTransport.class' > /dev/null

  npm:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@gopherex"
      - name: Install
        run: npm ci
      - name: Build workspaces
        run: npm run --workspaces build
      - name: Publish @gopherex/ws-proto-transport
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --workspace @gopherex/ws-proto-transport
      - name: Publish @gopherex/protoc-gen-ws-es
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --workspace @gopherex/protoc-gen-ws-es
      - name: Verify published npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/npm-download"
          cd "$RUNNER_TEMP/npm-download"
          npm init -y
          npm install --ignore-scripts "@gopherex/ws-proto-transport@${TAG#v}" "@gopherex/protoc-gen-ws-es@${TAG#v}"
          node --input-type=module -e 'await import("@gopherex/ws-proto-transport")'
          test -x node_modules/.bin/protoc-gen-ws-es
