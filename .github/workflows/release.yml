name: Release

# Triggered by pushing a vX.Y.Z tag (see `make release`). Builds the
# protoc-gen-go-ws plugin binaries for every platform and publishes both npm
# packages to GitHub Packages, all gated on a green CI run.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Releases must build green: reuse the full CI suite.
  ci:
    uses: ./.github/workflows/ci.yml

  create-release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"

  binaries:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    env:
      TAG: ${{ github.ref_name }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum
      - name: Build protoc-gen-go-ws
        run: |
          out="protoc-gen-go-ws"
          if [ "$GOOS" = "windows" ]; then out="protoc-gen-go-ws.exe"; fi
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "dist/$out" ./cmd/protoc-gen-go-ws
      - name: Archive
        id: archive
        run: |
          base="protoc-gen-go-ws_${TAG}_${GOOS}_${GOARCH}"
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip "../${base}.zip" protoc-gen-go-ws.exe
            echo "asset=${base}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "../${base}.tar.gz" protoc-gen-go-ws
            echo "asset=${base}.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.archive.outputs.asset }}
        run: gh release upload "$TAG" "$ASSET" --clobber

  npm:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@gopherex"
      - name: Install
        run: npm ci
      - name: Build workspaces
        run: npm run --workspaces build
      - name: Publish @gopherex/ws-transport
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --workspace @gopherex/ws-transport
      - name: Publish @gopherex/protoc-gen-ws-es
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --workspace @gopherex/protoc-gen-ws-es
