name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call: # reused by release.yml to gate releases on a green build

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++23 (native and browser WASM against Go)
    runs-on: ubuntu-24.04
    env:
      VCPKG_MAX_CONCURRENCY: 4
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: browser-actions/setup-firefox@v1
      - name: Install EasyP and the C++ toolchains
        shell: bash
        run: |
          go install github.com/easyp-tech/easyp/cmd/easyp@v1.0.0-nightly.20261014.1.0.20261026020002-61d2abd7dbd3
          git clone --depth 1 --branch 4.0.23 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.23
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.23
          git init "$RUNNER_TEMP/vcpkg"
          # Versioned installs resolve port trees from the history of this baseline.
          git -C "$RUNNER_TEMP/vcpkg" fetch https://github.com/microsoft/vcpkg.git 9eec002df1cd109f8f104cd966a763daf9751489
          git -C "$RUNNER_TEMP/vcpkg" checkout FETCH_HEAD
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - name: Test generated C++ client
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          make test-cpp
          scripts/test-cpp-registry.sh --local

  go:
    name: Go (build, vet, test -race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt needed on:"; echo "$out"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: build plugin
        run: go build -o bin/protoc-gen-go-ws ./cmd/protoc-gen-go-ws
      - name: go test -race
        run: go test -race ./...

  ts:
    name: TypeScript (build, test, cross-lang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The protoc-gen-ws-es cross-language test builds and runs the Go example
      # server, so the Node job needs the Go toolchain too.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: install
        run: npm ci
      - name: build workspaces
        run: npm run --workspaces build
      - name: test workspaces
        run: npm run --workspaces test
      - name: typecheck workspaces (incl. tests)
        # Runs after test so the generated client under test/gen exists.
        run: npm run --workspaces typecheck

  swift:
    name: Swift (unit, Go interoperability, iOS build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum
      - name: Test Swift against Go
        run: scripts/with-mobile-server.sh swift test
      - name: Build for iOS Simulator
        run: >-
          xcodebuild -scheme WsProto -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build

  kotlin:
    name: Kotlin JVM (unit, Go interoperability, Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test Kotlin against Go and assemble publication
        run: >-
          scripts/with-mobile-server.sh packages/ws-proto-kotlin/gradlew
          -p packages/ws-proto-kotlin --no-daemon jvmTest publishJvmPublicationToMavenLocal
      - name: Compile and dex Android consumer
        run: >-
          packages/ws-proto-kotlin/gradlew -p tests/android-consumer
          --no-daemon assembleDebug

  kotlin-ios:
    name: Kotlin iOS (Go interoperability, SKIE Swift consumer)
    runs-on: macos-15
    env:
      WS_PROTO_GRADLE: gradle
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Cache Kotlin Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-2.2.21-v1
      - name: Test Swift AsyncSequence and cancellation through SKIE
        run: scripts/with-mobile-server.sh scripts/test-kmp-swift.sh
      - name: Link application framework for iOS devices
        run: gradle -p tests/kmp-consumer --no-daemon linkDebugFrameworkIosArm64
      - name: Test shared runtime on iOS Simulator against Go
        if: ${{ !cancelled() }}
        run: >-
          scripts/with-ios-simulator.sh scripts/with-mobile-server.sh gradle
          -p packages/ws-proto-kotlin --no-daemon iosSimulatorArm64Test
      - name: Assemble all KMP publications
        if: ${{ !cancelled() }}
        run: gradle -p packages/ws-proto-kotlin --no-daemon publishToMavenLocal

