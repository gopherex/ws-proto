name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call: # reused by release.yml to gate releases on a green build

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (build, vet, test -race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt needed on:"; echo "$out"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: build plugin
        run: go build -o bin/protoc-gen-go-ws ./cmd/protoc-gen-go-ws
      - name: go test -race
        run: go test -race ./...

  ts:
    name: TypeScript (build, test, cross-lang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The protoc-gen-ws-es cross-language test builds and runs the Go example
      # server, so the Node job needs the Go toolchain too.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: install
        run: npm ci
      - name: build workspaces
        run: npm run --workspaces build
      - name: test workspaces
        run: npm run --workspaces test
      - name: typecheck workspaces (incl. tests)
        # Runs after test so the generated client under test/gen exists.
        run: npm run --workspaces typecheck

  rust:
    name: Rust (fmt, clippy, test, golden gen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The golden run drives protoc-gen-ws-rs through easyp next to the
      # neoeinstein prost plugins, exactly as a user would.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum
      - name: install codegen plugins
        run: |
          go install github.com/easyp-tech/easyp/cmd/easyp@v0.16.6  # v0.17+ needs go >= 1.26 and changes config
          cargo install protoc-gen-prost protoc-gen-prost-crate protoc-gen-tonic --locked
      - name: test-rs
        run: make test-rs
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: npm ci (TS client for the interop matrix)
        run: npm ci && npm run --workspaces build
      - name: test-interop
        run: make test-interop
