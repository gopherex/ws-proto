# Golden/integration run for the plugin (make test-rs): generates test/gen/
# from test/echo.proto with prost + this plugin (built into ../../target/debug).
lint:
  use:
    - DEFAULT
  except:
    - PACKAGE_VERSION_SUFFIX
deps:
generate:
  inputs:
    - directory: test
  plugins:
    - name: prost
      out: test/gen/src
      opts:
        bytes: "."
    - path: ../../target/debug/protoc-gen-ws-rs
      out: test/gen/src
    - name: prost-crate
      out: test/gen
      opts:
        gen_crate: test/Cargo.toml.tmpl
