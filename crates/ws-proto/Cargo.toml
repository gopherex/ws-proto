[package]
name = "ws-proto"
description = "WebSocket transport for protobuf RPC services — Rust runtime (wsrpc.v1 wire protocol)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["protobuf", "websocket", "rpc", "prost", "grpc"]
categories = ["network-programming", "web-programming::websocket"]

[features]
default = ["tungstenite"]
# WsConn adapter for tokio-tungstenite (what axum / warp / actix-ws hand you).
tungstenite = ["dep:tokio-tungstenite", "dep:http", "tokio/io-util", "tokio/net"]
# `Server::register_grpc`: serve any tonic / tower gRPC service over ws-proto
# with no generated glue (Go `wsrpc.GRPCRegistrar`).
tonic = ["dep:tonic", "dep:tower-service", "dep:http-body", "dep:http-body-util", "dep:http", "dep:prost-types"]

[dependencies]
bytes.workspace = true
futures-core.workspace = true
futures-sink.workspace = true
futures-util.workspace = true
prost.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["net"] }
ws-proto-frame = { version = "1.8.2", path = "../ws-proto-frame" }

tokio-tungstenite = { workspace = true, optional = true }
http = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "test-util"] }
tokio-tungstenite = { workspace = true }
tonic-health = { workspace = true }
tonic = { workspace = true }
prost-types.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
tower-service.workspace = true
tower.workspace = true
