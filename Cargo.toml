# Rust workspace: the Rust runtime + protoc plugin live under crates/.
# Go (go.mod) and TypeScript (package.json) roots sit alongside; `make release`
# keeps all three on one version.
[workspace]
resolver = "2"
members = ["crates/*", "example/rust/*"]

[workspace.package]
version = "1.7.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/gopherex/ws-proto"
homepage = "https://github.com/gopherex/ws-proto"

[workspace.dependencies]
bytes = "1.10"
prost = "0.14"
futures-core = "0.3"
futures-sink = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
thiserror = "2"
tokio = "1"
tokio-util = "0.7"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "connect"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
tonic = { version = "0.14", default-features = false }
tonic-prost = "0.14"
tonic-health = { version = "0.14", default-features = false }
tower-service = "0.3"
tower = { version = "0.5", default-features = false, features = ["util", "timeout"] }
tokio-stream = "0.1"
prost-types = "0.14"
prost-build = { version = "0.14", default-features = false }
protoc-gen-prost = "0.5"
heck = "0.5"
prettyplease = "0.2"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["parsing", "full"] }

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
