lint:
  use:
    - DEFAULT
  enum_zero_value_suffix: _UNSPECIFIED
  service_suffix: Service
  except:
    - PACKAGE_VERSION_SUFFIX
  allow_comment_ignores: false
deps:
generate:
  inputs:
    - directory: proto
  plugins:
    - name: go
      out: .
      opts:
        paths: source_relative
    - name: go-grpc
      out: .
      opts:
        paths: source_relative
    - name: go-ws
      out: .
      opts:
        paths: source_relative
    # Rust golden crate: rust/echo-proto is fully generated (make gen-example
    # puts protoc-gen-ws-rs on PATH from target/debug). The tonic output is
    # only there so the example can serve a tonic service via register_grpc.
    - name: prost
      out: rust/echo-proto/src
      opts:
        bytes: "."
    - name: tonic
      out: rust/echo-proto/src
      opts:
        no_client: true
        no_transport: true
    - name: ws-rs
      out: rust/echo-proto/src
    - name: prost-crate
      out: rust/echo-proto
      opts:
        gen_crate: rust/echo-proto.Cargo.toml.tmpl
