[package]
name = "ws-proto-example-server"
description = "Standalone echo.v1 ws-proto server (Rust) for the cross-language tests"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "ws-proto-example-server"
path = "src/main.rs"

[dependencies]
echo-proto = { package = "ws-proto-example-echo-proto", path = "../echo-proto" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-stream.workspace = true
tonic = { workspace = true, features = ["codegen"] }
ws-proto = { path = "../../../crates/ws-proto", features = ["tonic"] }

[dev-dependencies]
bytes.workspace = true
prost.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time"] }
