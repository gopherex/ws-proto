lint:
  use:
    - DEFAULT
  enum_zero_value_suffix: _UNSPECIFIED
  service_suffix: API
  ignore: []
  except:
    - PACKAGE_VERSION_SUFFIX
  allow_comment_ignores: false
deps:
generate:
  inputs:
    - directory: transport
  plugins:
    - name: go
      out: .
      opts:
        paths: source_relative
    # Rust: crates/ws-proto-frame is fully generated by the neoeinstein plugins
    # (cargo install protoc-gen-prost protoc-gen-prost-crate).
    #  - prost       → src/wsproto/transport/v1/wsproto.transport.v1.rs (message types)
    #  - prost-crate → Cargo.toml (from assets/Cargo.toml.tmpl) + src/lib.rs (include! tree)
    - name: prost
      out: crates/ws-proto-frame/src
      opts:
        bytes: "."
        btree_map: "."
    - name: prost-crate
      out: crates/ws-proto-frame
      opts:
        gen_crate: assets/Cargo.toml.tmpl
