syntax = "proto3";
package wiretest;
option java_package = "wiretest.when";
option java_outer_classname = "IgnoredOuter";

message PresenceMessage {
  enum State {
    UNKNOWN = 0;
    READY = 1;
  }
  optional string text = 1;
  State state = 2;
  string when = 3;
}
service PresenceService {
  rpc Echo(PresenceMessage) returns (PresenceMessage);
}
